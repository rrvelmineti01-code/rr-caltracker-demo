[theme]
base = "light"
font = "sans serif"
showWidgetBorder = true
baseRadius = "0.75rem"

[theme.light]
primaryColor = "#2B5038"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7F2"
textColor = "#1D2C22"
borderColor = "#DDE5DE"
linkColor = "#376344"
dataframeHeaderBackgroundColor = "#EDF4E9"
dataframeHeaderTextColor = "#1D2C22"

[theme.dark]
primaryColor = "#83AB89"
backgroundColor = "#131B16"
secondaryBackgroundColor = "#202F25"
textColor = "#ECF4ED"
borderColor = "#3C5042"
linkColor = "#B7DABB"
dataframeHeaderBackgroundColor = "#263E2B"
dataframeHeaderTextColor = "#ECF4ED"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
